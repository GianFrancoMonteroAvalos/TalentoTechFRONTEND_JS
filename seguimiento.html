<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Pedido - GGGrowShop</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d0d0d 0%, #212121 100%);
            min-height: 100vh;
            color: #d6dfed;
            padding: 20px 0;
        }
        .tracking-header {
            background: rgba(99, 42, 129, 0.3);
            padding: 20px;
            border-bottom: 2px solid #2CE6C2;
            margin-bottom: 30px;
        }
        .tracking-header h1 {
            color: #2CE6C2;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d6dfed;
        }
        .card-header {
            background: rgba(99, 42, 129, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .progress {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="tracking-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h1><i class="fas fa-shipping-fast me-2"></i>Seguimiento de Pedido</h1>
                <div>
                    <a href="index.html" class="btn btn-outline-light">
                        <i class="fas fa-home me-2"></i>Inicio
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="alert-container" class="position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index: 1050;"></div>
        
        <div id="tracking-container">
            <!-- El contenido se cargará aquí -->
        </div>
    </div>

    <script src="js/services/OrderService.js"></script>
    <script src="js/services/UIService.js"></script>
    <script src="js/components/OrderTracking.js"></script>
    <script>
        const orderService = new OrderService();
        const uiService = new UIService();

        const orderTracking = new OrderTracking(orderService, uiService);
        orderTracking.init();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
